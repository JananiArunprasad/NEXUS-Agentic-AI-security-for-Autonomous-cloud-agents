name: Public demo checks

on:
  push:
    branches:
      - main
      - fix/dynamic-public-agent-planning
  pull_request:

jobs:
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-demo.txt
          python -m pip install pytest httpx
      - name: Check Python syntax
        run: python -m compileall -q app/public_app.py app/agent/public_planner.py
      - name: Run public planner tests
        run: python -m pytest -q tests/test_public_planner.py
